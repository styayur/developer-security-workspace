# Native maintenance: 09:00 Asia/Singapore on the 1st and 15th.
# Version updates exclude major releases; security updates retain their independent queue.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: cron
      cronjob: 0 9 1,15 * *
      timezone: Asia/Singapore
    open-pull-requests-limit: 3
    groups:
      frontend-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: cron
      cronjob: 0 9 1,15 * *
      timezone: Asia/Singapore
    open-pull-requests-limit: 3
    groups:
      rust-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: 0 9 1,15 * *
      timezone: Asia/Singapore
    open-pull-requests-limit: 3
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      github-actions-compatible:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
