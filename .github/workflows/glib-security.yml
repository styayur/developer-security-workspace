name: GLib source backport

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  optimized-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Provision and verify native GLib headers
        run: |
          if ! pkg-config --atleast-version=2.78 glib-2.0 || ! pkg-config --exists gobject-2.0 gio-2.0; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends libglib2.0-dev
          fi
          pkg-config --atleast-version=2.78 glib-2.0
          pkg-config --modversion glib-2.0 gobject-2.0 gio-2.0
      - name: Verify vendored source identity
        run: python3 security/verify_glib_backport.py
      - name: Optimized pointer and iterator regression
        run: cargo run --release --locked --manifest-path security/glib-regression/Cargo.toml
      - name: Record target-specific dependency reachability
        run: |
          cargo tree --locked --workspace --all-features --manifest-path src-tauri/Cargo.toml --target x86_64-unknown-linux-gnu -i glib > security/glib-linux-tree.txt
          cargo tree --locked --workspace --all-features --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc -i glib > security/glib-windows-tree.txt
      - uses: actions/upload-artifact@v4
        with:
          name: glib-target-reachability
          path: security/glib-*-tree.txt
