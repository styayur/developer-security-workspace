# Caller template. Copy to a public repository as .github/workflows/portfolio-gate.yml.
# Replace a0e7ff969f2f065f982c2cf763e863c719e963fa with the reviewed portfolio-governance commit SHA.
name: Portfolio Evidence Gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, labeled, unlabeled]

permissions:
  actions: read
  checks: write
  contents: write
  issues: write
  pull-requests: write
  security-events: read
  statuses: read

jobs:
  portfolio:
    uses: styayur/portfolio-governance/.github/workflows/reusable-portfolio-gate.yml@a0e7ff969f2f065f982c2cf763e863c719e963fa
    with:
      pr_number: ${{ github.event.pull_request.number }}
      head_sha: ${{ github.event.pull_request.head.sha }}
      base_sha: ${{ github.event.pull_request.base.sha }}
      central_sha: a0e7ff969f2f065f982c2cf763e863c719e963fa
