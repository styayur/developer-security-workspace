# Caller template. Copy to a public repository as .github/workflows/portfolio-gate.yml.
# Replace d34be191d8578b891a1db2c54308d154520389e6 with the reviewed portfolio-governance commit SHA.
name: Portfolio Evidence Gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, labeled, unlabeled]

permissions:
  actions: read
  checks: write
  contents: read
  issues: write
  pull-requests: write
  security-events: read
  statuses: read

jobs:
  portfolio:
    uses: styayur/portfolio-governance/.github/workflows/reusable-portfolio-gate.yml@d34be191d8578b891a1db2c54308d154520389e6
    with:
      pr_number: ${{ github.event.pull_request.number }}
      head_sha: ${{ github.event.pull_request.head.sha }}
      base_sha: ${{ github.event.pull_request.base.sha }}
      central_sha: d34be191d8578b891a1db2c54308d154520389e6
