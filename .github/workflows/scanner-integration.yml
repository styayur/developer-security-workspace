name: Real scanner smoke (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  providers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install semgrep==1.178.0 bandit==1.9.4
      - uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.74.0
          cache: true
      - name: Install explicitly pinned TruffleHog and verify checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/trufflehog"
          gh release download v3.97.9 --repo trufflesecurity/trufflehog --pattern '*linux_amd64.tar.gz' --pattern '*checksums.txt' --dir "$RUNNER_TEMP/trufflehog"
          cd "$RUNNER_TEMP/trufflehog"
          sha256sum --check --ignore-missing *checksums.txt
          tar -xzf *linux_amd64.tar.gz trufflehog
          sudo install -m 755 trufflehog /usr/local/bin/trufflehog
      - name: Explicit Trivy database download for smoke fixture
        run: trivy image --download-db-only
      - name: Install pinned Gitleaks for the approved extension smoke test
        run: |
          curl --fail --location --output "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked installed_scanners_execute_through_providers -- --ignored --nocapture
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked real_gitleaks_extension_smoke -- --ignored --nocapture
