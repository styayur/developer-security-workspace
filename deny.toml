# Narrow exceptions, if needed, require advisory ID, rationale, owner and review date.
# See docs/release.md. Never blanket-ignore vulnerabilities.
[graph]
all-features = true

[advisories]
yanked = "warn"
unmaintained = "workspace"

[licenses]
confidence-threshold = 0.8
allow = ["AGPL-3.0-only", "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-3-Clause", "Zlib", "Unicode-3.0", "MPL-2.0", "CC0-1.0", "Unlicense"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
